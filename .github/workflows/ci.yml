name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt -e .
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test (includes an offline end-to-end run with dbt checks)
        run: pytest -q
