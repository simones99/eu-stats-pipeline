name: refresh

# Monthly run against the live Eurostat API. The quality report, data dictionary
# and dashboard are uploaded as a build artifact for review before committing.
on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -e .
      - name: Run pipeline
        run: eustats run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eustats-outputs
          path: |
            docs/quality-report.md
            docs/data-dictionary.md
            site/index.html
            data/raw/manifest.json
