[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eustats"
version = "0.2.0"
description = "Reproducible Eurostat regional statistics pipeline with validation and quality reporting"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
eustats = "eustats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
